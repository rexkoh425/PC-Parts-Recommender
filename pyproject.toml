[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-build-recommender"
version = "0.1.0"
description = "Component retrieval and build recommendation for desktop PCs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0,<3",
  "orjson>=3.10,<4",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "packages/core/src"}

[tool.setuptools.packages.find]
where = ["packages/core/src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["packages/core/src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/core/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
