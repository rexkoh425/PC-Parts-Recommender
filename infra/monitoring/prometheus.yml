global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: pc-build-recommender

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: pcbr-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: core-http-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8000/health/live
        labels:
          probe_name: api-liveness
          criticality: core
      - targets:
          - http://api:8000/health/ready
        labels:
          probe_name: api-readiness
          criticality: core
      - targets:
          - http://web:3000/
        labels:
          probe_name: web
          criticality: core
      - targets:
          - http://dagster-webserver:3001/server_info
        labels:
          probe_name: dagster-webserver
          criticality: optional
      - targets:
          - http://mlflow:5000/health
        labels:
          probe_name: mlflow
          criticality: optional
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
