name: security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Audit locked Python production and optional dependencies
        run: |
          uv export --locked --all-extras --no-dev --no-emit-project \
            --format requirements-txt --output-file requirements.audit.txt
          uvx --from pip-audit pip-audit \
            --requirement requirements.audit.txt --strict --progress-spinner off \
            --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Audit browser-shipped Node dependencies
        run: npm audit --omit=dev --audit-level=high

  source-and-iac-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan filesystem, secrets, dependencies, and infrastructure configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-filesystem.sarif
      - name: Upload filesystem scan
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-filesystem.sarif

  dockerfile-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - infra/api.Dockerfile
          - infra/web.Dockerfile
          - infra/dagster.Dockerfile
          - infra/mlflow.Dockerfile
          - infra/postgres-exporter.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/api.Dockerfile
          - name: web
            dockerfile: infra/web.Dockerfile
          - name: dagster
            dockerfile: infra/dagster.Dockerfile
          - name: mlflow
            dockerfile: infra/mlflow.Dockerfile
          - name: postgres-exporter
            dockerfile: infra/postgres-exporter.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the exact runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: pcbr/${{ matrix.name }}:security-scan
          cache-from: type=gha,scope=security-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=security-${{ matrix.name }}
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pcbr/${{ matrix.name }}:security-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  secret-history-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
